name: Deploy PRISM to GitHub Pages

on:
  # Push triggers are disabled by default for template users.
  # Uncomment the lines below to enable automatic deployment on push.
  # push:
  #  branches: 
  #      - main
  #      - ci
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun ci

      - name: Build site
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          if [ "$repo_name" != "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            export NEXT_PUBLIC_BASE_PATH="/$repo_name"
          fi
          bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
